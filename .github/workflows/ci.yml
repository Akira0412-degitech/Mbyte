name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v

  python:
    name: Python (pytest, reference impl)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[test]
      - run: pytest -q
